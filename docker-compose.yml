services:
  postgres:
    # Pinned to match the Postgres major version running live on Railway
    # (18). Using the standard postgres image here, not Railway's
    # ghcr.io/railwayapp-templates/postgres-ssl wrapper -- that image's
    # entrypoint references Railway-only env vars (RAILWAY_VOLUME_MOUNT_PATH,
    # etc.) and won't start correctly outside Railway's platform.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed
      POSTGRES_DB: feed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    # Pinned to match the Redis version running live on Railway (8.2).
    # Railway's Redis service also bundles Stack modules (ReJSON, search,
    # timeseries, bloom) this app doesn't use; the plain redis:8.2-alpine
    # image is functionally identical for everything this repo does with it.
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: &env
      DATABASE_URL: postgresql://feed:feed@postgres:5432/feed
      REDIS_URL: redis://redis:6379/0
      N_SHARDS: ${N_SHARDS:-4}
      QUEUE_MAX_LEN: ${QUEUE_MAX_LEN:-500}
      QUEUE_RESUME_RATIO: ${QUEUE_RESUME_RATIO:-0.6}
      CELEBRITY_THRESHOLD: ${CELEBRITY_THRESHOLD:-1000}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-5}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-0.5}
      POOL_MIN_SIZE: ${POOL_MIN_SIZE:-2}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-10}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-seed-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python worker/worker.py
    environment: *env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      replicas: ${N_WORKERS:-3}

volumes:
  pgdata:
